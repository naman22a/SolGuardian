services:
  db:
    image: mongo:8
    restart: always
    container_name: SolGuardian-mongodb
    environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root}
    healthcheck:
        test: >
            echo 'db.runCommand("ping").ok' | mongosh
            --host localhost
            --port 27017
            -u $$MONGO_INITDB_ROOT_USERNAME
            -p $$MONGO_INITDB_ROOT_PASSWORD
            --authenticationDatabase admin
            --quiet
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    restart: always
    container_name: SolGuardian-redis
    ports:
        - '6379:6379'
    volumes:
        - redis-data:/data
    healthcheck:
        test: ['CMD', 'redis-cli', 'ping']
        interval: 10s
        timeout: 5s
        retries: 5

  server:
    image: naman22a/solguardian-server
    container_name: SolGuardian-server
    depends_on:
      - db
      - redis
    ports:
      - '5000:5000'
    environment:
        NODE_ENV: production
        PORT: 5000
        CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
        REDIS_HOST: redis
        REDIS_PORT: 6379
        MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-root}@db:27017
        OLLAMA_URL: http://ollama:11434
        OLLAMA_MODEL: codellama

  worker:
    image: naman22a/solguardian-worker
    container_name: SolGuardian-worker
    depends_on:
      - server
      - db
      - redis
    environment:
        NODE_ENV: production
        PORT: 5000
        CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
        REDIS_HOST: redis
        REDIS_PORT: 6379
        MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-root}@db:27017
        OLLAMA_URL: http://ollama:11434
        OLLAMA_MODEL: codellama

  web:
    image: naman22a/solguardian-web
    container_name: SolGuardian-web
    depends_on:
      - server
      - worker
    environment:
      NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:5000}
    ports:
      - '3000:3000'

  ollama:
    image: ollama/ollama
    container_name: SolGuardian-ollama
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-codellama}
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull $OLLAMA_MODEL && wait"

volumes:
  redis-data:
  mongodb-data:
  ollama-data:

networks:
    default:
        name: SolGuardian-network
